[Settings]

# =========================
# 频道模板与输出
# =========================

source_file = config/user_demo.txt
final_file = output/user_result.txt

open_update = True
open_m3u_result = True

# 每个频道最多保留 3 条线路
output_urls_limit = 3

# 第一次调试建议开启，方便看到哪些频道完全没找到源
open_empty_category = True

# 不把模板之外的频道塞进结果
open_unmatch_category = False

# 避免部分播放器无法解析 $ 后面的接口说明
open_url_info = False


# =========================
# 数据源
# =========================

open_subscribe = True
open_local = True

# GitHub Actions 中自动修改 subscribe.txt 不会持久保存，因此关闭
open_auto_disable_source = False

# 保留历史结果；Actions 能恢复缓存时可以利用
open_history = True

# 保留 M3U 内的 UA / Referer 等信息
# 香港及部分地方源尤其需要
open_headers = True

user_agent =


# =========================
# 测速
# =========================

open_speed_test = True

# 推荐 quick，不建议每次 full
speed_test_mode = quick

# 每频道找到 3 条合格线路后停止继续测速
quick_test_target = 3

# GitHub Actions 自动决定并发
performance_mode = auto
speed_test_limit = 0

# 单线路最多测试 10 秒
speed_test_timeout = 10
request_timeout = 10


# =========================
# 画质与速度过滤
# =========================

open_filter_resolution = True

# 香港/地方频道有些只有 SD/较低分辨率，不要限制到 720p
min_resolution = 640x360
max_resolution = 3840x2160

open_filter_speed = True

# GitHub runner 测试与家庭网络并不完全一致，
# 阈值不要设得太高
min_speed = 0.15

resolution_speed_map = 1280x720:0.15,1920x1080:0.30,3840x2160:0.80

# 过滤明显的广告/无信号循环源
open_filter_ad = True

# 优先稳定速度，其次延迟，再看分辨率
sort_by = speed,delay,resolution


# =========================
# 后备源
# =========================

# 第一轮建议关闭：宁可没有，也不要把测速不合格源塞回来
open_supply = False


# =========================
# IPv4 / IPv6
# =========================

# GitHub Actions 对 IPv6 环境不适合作为你家庭网络的代表，
# 第一版只筛 IPv4，结果更可控
ipv6_support = False
ipv_type = ipv4
ipv_type_prefer = ipv4

location =
isp =


# =========================
# EPG 与台标
# =========================

open_epg = True

# 不自动抓取每个上游订阅声明的 EPG，
# 避免 Actions 增加大量 XML 网络/解析负担
open_subscribe_epg = False

# 优先使用订阅源自带的台标
open_subscribe_logo = True


# =========================
# 截图 / 推流
# =========================

# GitHub Actions 不需要自动截图
open_stream_screenshot = False
